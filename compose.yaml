services:
    laravel.test:
        build:
            context: './docker/runtimes/latest'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                MYSQL_CLIENT: mariadb-client
        image: 'server/runtimes:latest'
        cpus: 2
        mem_limit: 128m
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - server
        depends_on:
            - mariadb
            - redis
            - memcached
    mariadb:
        image: 'mariadb:11'
        cpus: 2
        mem_limit: 128m
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        volumes:
            - './docker/database/mariadb/mysql:/var/lib/mysql'
            - './docker/database/mariadb/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - server
        healthcheck:
            test:
                - CMD
                - healthcheck.sh
                - '--connect'
                - '--innodb_initialized'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        cpus: 1
        mem_limit: 64m
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - './docker/database/redis/data:/data'
        networks:
            - server
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    memcached:
        image: 'memcached:alpine'
        cpus: 1
        mem_limit: 64m
        ports:
            - '${FORWARD_MEMCACHED_PORT:-11211}:11211'
        networks:
            - server
    adminer:
        image: adminer
        restart: always
        ports:
            - 8080:8080
        networks:
            - server
        depends_on:
            - mariadb
networks:
    server:
        driver: bridge
volumes:
    mariadb:
        driver: local
    redis:
        driver: local
